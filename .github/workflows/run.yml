      - name: Generate stash ruleset
        run: |
          cp -r meta/. stash/
          rm -f stash/domain/fake-ip-filter*

      - name: Generate shadowrocket ruleset
        run: |
          for file in meta/*.list; do
              awk '{
                  if ($0 ~/^DOMAIN-REGEX,/ || $0 ~ /^PROCESS-NAME,/) {
                      next;
                  }
                  sub(/^IP-CIDR6/, "IP-CIDR");
                  print;
              }' "$file" > "shadowrocket/$(basename "$file")"
          done

      - name: Generate quantumultx ruleset
        run: |
          for file in meta/*.list; do
              awk -v filename="$(basename "$file" .list)" '{
                  if ($0 ~ /^#/) {
                      print;
                      next;
                  }
                  if ($0 ~ /^DOMAIN-REGEX,/ || $0 ~ /^PROCESS-NAME,/) {
                      next;
                  }
                  sub(/^DOMAIN/, "HOST");
                  sub(/^DOMAIN-SUFFIX/, "HOST-SUFFIX");
                  sub(/^DOMAIN-KEYWORD/, "HOST-KEYWORD");
                  sub(/^DOMAIN-WILDCARD/, "HOST-WILDCARD");
                  sub(/^IP-CIDR6/, "IP6-CIDR");
                  sub(/,no-resolve$/, "");
                  print $0 "," filename;
              }' "$file" > "quantumultx/$(basename "$file")"
          done
          rm -f quantumultx/*-resolve.list

      - name: Generate loon ruleset
        run: |
          for file in meta/*.list; do
              awk '{
                  if ($0 ~ /^DOMAIN-REGEX,/) {
                      next;
                  }
                  print;
              }' "$file" > "loon/$(basename "$file")"
          done

      - name: Generate egern ruleset
        run: |
          for file in meta/*.list; do
              grep -q ',no-resolve$' "$file" && found_no_resolve=1 || found_no_resolve=0
              awk -F',' -v found_no_resolve="$found_no_resolve" '
              BEGIN {
                  if (found_no_resolve) print "no_resolve: true";
              }
              {
                  if ($0 ~ /^#/) {
                      print;
                      next;
                  }
                  if($1 == "DOMAIN-REGEX" && match($0, ",")){
                      $2 = substr($0, RSTART + 1);
                  }
                  sub(/^"/, "", $2);
                  sub(/^'"'"'/, "", $2);
                  sub(/"$/, "", $2);
                  sub(/'"'"'$/, "", $2);
                  chars = "[{}\\[\\]&*#|<>!%@`]"
                  if ($2 ~ "^" chars) {
                      $2 = sprintf("\x27%s\x27", $2);
                  }
                  if ($1 == "DOMAIN") {
                      if (!domain++) print "domain_set:";
                      print "- " $2;
                  } else if ($1 == "DOMAIN-SUFFIX") {
                      if (!suffix++) print "domain_suffix_set:";
                      print "- " $2;
                  } else if ($1 == "DOMAIN-KEYWORD") {
                      if (!keyword++) print "domain_keyword_set:";
                      print "- " $2;
                  } else if ($1 == "DOMAIN-WILDCARD") {
                      if (!wildcard++) print "domain_wildcard_set:";
                      print "- " $2;
                  } else if ($1 == "DOMAIN-REGEX") {
                      if (!regex++) print "domain_regex_set:";
                      print "- " $2;
                  } else if ($1 == "IP-CIDR") {
                      if (!cidr++) print "ip_cidr_set:";
                      print "- " $2;
                  } else if ($1 == "IP-CIDR6") {
                      if (!cidr6++) print "ip_cidr6_set:";
                      print "- " $2;
                  } else if ($1 == "IP-ASN") {
                      if (!asn++) print "asn_set:";
                      print "- " $2;
                  } else if ($1 == "USER-AGENT") {
                      if (!user_agent++) print "user_agent_set:";
                      print "- " $2;
                  } else if ($1 == "URL-REGEX") {
                      if (!url_regex++) print "url_regex_set:";
                      print "- " $2;
                  } else if ($1 == "GEOIP") {
                      if (!geoip++) print "geoip_set:";
                      print "- " $2;
                  } else if ($1 == "DEST-PORT") {
                      if (!dest_port++) print "dest_port_set:";
                      print "- " $2;
                  } else if ($1 == "PROTOCOL") {
                      if (!protocol++) print "protocol_set:";
                      print "- " $2;
                  }
              }' "$file" > "egern/$(basename "$file" ".list").yaml"
          done

      - name: Generate surge ruleset
        run: |
          for file in meta/*.list; do
              awk '{
                  if ($0 ~ /^DOMAIN-REGEX,/) {
                      next;
                  }
                  print;
              }' "$file" > "surge/$(basename "$file")"
          done

      - name: Move files to push directory
        run: |
          source scripts/ruleset_metadata.sh

          # Add provenance to generated text variants too. Binary formats keep
          # their valid binary/JSON encoding and are linked through README.
          for directory in meta/domain meta/ipcidr meta/classical stash/domain stash/ipcidr stash/classical; do
              [[ -d "$directory" ]] || continue
              for file in "$directory"/*.list; do
                  [[ -f "$file" ]] || continue
                  source_file="meta/$(basename "$file" .list).list.sources"
                  if [[ "$directory" == */ipcidr && "$(basename "$file")" == "cn.list" ]]; then
                      source_file="meta/cncidr.list.sources"
                  fi
                  add_metadata_header "$file" "$update_time" "$source_file"
              done
          done

          for directory in surge shadowrocket quantumultx loon; do
              for file in "$directory"/*.list; do
                  [[ -f "$file" ]] || continue
                  source_file="meta/$(basename "$file" .list).list.sources"
                  add_metadata_header "$file" "$update_time" "$source_file"
              done
          done

          for file in egern/*.yaml; do
              [[ -f "$file" ]] || continue
              source_file="meta/$(basename "$file" .yaml).list.sources"
              add_metadata_header "$file" "$update_time" "$source_file"
          done

          find meta stash surge shadowrocket quantumultx loon egern -type f -name '*.sources' -delete

          cp -r singbox/ push/
          cp -r meta/ push/
          cp -r stash/ push/
          cp -r surge/ push/
          cp -r shadowrocket/ push/
          cp -r quantumultx/ push/
          cp -r loon/ push/
          cp -r egern/ push/

      - name: Git push assets to "ruleset" branch
        run: |
          cd push || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ruleset
          git add .
          git commit -m "Auto Update Ruleset ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin ruleset

      - name: Purge jsdelivr CDN
        run: |
          cd push || exit 1
          for file in $(ls); do
              curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@ruleset/${file}"
          done

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
