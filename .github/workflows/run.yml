                  }
              ' "$file"
          done

      - name: Generate meta ipcidr
        run: |
          for file in meta/*.list; do
              filename=$(basename "$file" .list)

              awk -v output="meta/ipcidr/${filename}.list" '
                  /^IP-CIDR6?,/ {
                      sub(/^IP-CIDR6?,/, "");
