              awk -v output="meta/domain/${filename}.list" '
                  /^DOMAIN,|^DOMAIN-SUFFIX,/ {
                      sub(/^DOMAIN-SUFFIX,/, "+.");
                      sub(/^DOMAIN,/, "");
